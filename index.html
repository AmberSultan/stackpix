<!doctype html>
<!--
  THEME — the site ships light and dark, both defined in src/styles/globals.css.
  The visitor picks with the toggle in the header; the boot script below applies
  their choice (or their OS preference) before the first paint. `data-theme` is
  set by that script, so there is no value to hardcode here.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tints the browser chrome. Kept in step by src/lib/theme.ts. -->
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="color-scheme" content="light dark" />

    <!--
      Runs before the browser paints anything, which is the whole point: if the
      theme were applied from React instead, a dark-mode visitor would get a
      full white flash on every page load. Deliberately inline and dependency
      free so nothing has to be fetched first.

      The storage key is duplicated from src/lib/theme.ts — change both together.
    -->
    <script>
      (function () {
        try {
          // Light unless this visitor has explicitly chosen otherwise.
          // The OS dark-mode setting is deliberately NOT consulted: the site
          // is designed light-first, and a visitor whose laptop is in dark
          // mode would otherwise never see the intended design.
          var stored = localStorage.getItem('stackpixx-theme')
          var theme = stored === 'dark' ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', theme === 'dark' ? '#050505' : '#f7f7f4')
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <link rel="icon" type="image/svg+xml" href="/brand/logo.svg" />
    <!-- Raster, not the SVG: iOS ignores SVG here and falls back to a blank
         tile. Regenerated by `npm run optimize:images`. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />

    <!--
      SITE URL — currently the Vercel deployment. If you later add a custom
      domain, three lines below must change together: canonical, og:url and
      og:image. Leaving any of them pointing at the old host tells Google the
      real version of this page lives somewhere else.
    -->
    <title>StackPixx | Shopify Stores &amp; Web Design for Growing Brands</title>
    <meta
      name="description"
      content="We design and develop high-converting Shopify stores and websites for growing brands. Fixed price, live in two to four weeks, and everything is yours to keep."
    />
    <link rel="canonical" href="https://stackpix.vercel.app/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StackPixx" />
    <meta property="og:url" content="https://stackpix.vercel.app/" />
    <meta
      property="og:title"
      content="StackPixx | Shopify Stores &amp; Web Design for Growing Brands"
    />
    <meta
      property="og:description"
      content="We design and develop high-converting Shopify stores and websites for growing brands. Fixed price, live in two to four weeks."
    />
    <!-- Absolute, not relative: Facebook, WhatsApp and LinkedIn fetch this
         from their own servers and cannot resolve a path. -->
    <meta
      property="og:image"
      content="https://stackpix.vercel.app/brand/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="StackPixx: we design and develop high-converting websites for growing businesses."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Structured data. This is what lets Google connect the search term
      "StackPixx" to this business rather than guessing — it states the name,
      the services, and the social profiles that belong to it, in a format
      built to be machine-read.

      It lives in the static HTML on purpose: a crawler sees it without having
      to run any JavaScript.

      Validate changes at https://validator.schema.org before deploying.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "@id": "https://stackpix.vercel.app/#organization",
        "name": "StackPixx",
        "url": "https://stackpix.vercel.app/",
        "logo": "https://stackpix.vercel.app/brand/logo.svg",
        "image": "https://stackpix.vercel.app/brand/og-image.png",
        "email": "stackpixx@gmail.com",
        "description": "We design and develop high-converting Shopify stores and websites for growing brands. Fixed price, live in two to four weeks.",
        "areaServed": "Worldwide",
        "sameAs": [
          "https://www.instagram.com/stackpixx/",
          "https://www.facebook.com/profile.php?id=61592625421670"
        ],
        "knowsAbout": [
          "Shopify development",
          "Shopify theme customization",
          "UI/UX design",
          "React development",
          "Next.js development",
          "Brand identity design",
          "Social media design"
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Shopify Store Development" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Store Rescue & Rebuild" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Theme Customization" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "UI/UX Design" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "React / Next.js Development" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Brand Identity & Logo Design" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social Media Design" } }
          ]
        }
      }
    </script>

    <style>
      /* Matches the app background so the first paint is already correct,
         before the stylesheet or fonts have loaded. The boot script above has
         already stamped data-theme by the time this is evaluated. */
      html[data-theme='light'] {
        background-color: #f7f7f4;
      }
      html[data-theme='dark'] {
        background-color: #050505;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif">
        This site needs JavaScript enabled. Email
        <a href="mailto:stackpixx@gmail.com">stackpixx@gmail.com</a>
        and we will get straight back to you.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
