<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Paints the browser UI black before React mounts, so there is no white
         flash on load. Worth more than it looks on a site this dark. -->
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ↓↓↓ CHANGE ME — SEO. Keep the title under ~60 characters. ↓↓↓ -->
    <title>Northlane — Premium Shopify Stores &amp; Digital Experiences</title>
    <meta
      name="description"
      content="We design and build premium Shopify stores for fashion, jewellery, beauty and lifestyle brands — stores that look world-class and sell like it."
    />
    <link rel="canonical" href="https://example.com/" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://example.com/" />
    <meta
      property="og:title"
      content="Northlane — Premium Shopify Stores &amp; Digital Experiences"
    />
    <meta
      property="og:description"
      content="A premium Shopify design and development studio for fashion, jewellery, beauty and lifestyle brands."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <style>
      /* Matches the app background so the first paint is already correct,
         before the stylesheet or fonts have loaded. */
      html {
        background-color: #050505;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; color: #fff; font-family: system-ui, sans-serif">
        This site needs JavaScript enabled. Email
        <a href="mailto:hello@northlane.studio" style="color: #fff"
          >hello@northlane.studio</a
        >
        and we will get straight back to you.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
